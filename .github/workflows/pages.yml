name: Test, build WASM, and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust tests first
        run: cargo test

      - name: Install wasm-pack 0.15.0
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL             https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz             -o /tmp/wasm-pack.tar.gz
          tar -xzf /tmp/wasm-pack.tar.gz -C /tmp
          sudo install /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack /usr/local/bin/wasm-pack
          wasm-pack --version

      - name: Compile Rust to browser WASM
        run: wasm-pack build --release --target web --out-dir site/pkg

      - name: Install SPlisHSPlasH Emscripten build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends emscripten cmake ninja-build libeigen3-dev

      - name: Restore SPlisHSPlasH WASM build cache
        id: splish-cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/splishsplash-wasm-probe
          key: splishsplash-wasm-v2-${{ runner.os }}-emscripten-3.1.6-${{ hashFiles('tests/splishsplash-wasm/wasm-smoke/**', 'tests/splishsplash-wasm/prepare_emscripten.py', 'tests/splishsplash-wasm/build.sh') }}
          restore-keys: |
            splishsplash-wasm-v2-${{ runner.os }}-emscripten-3.1.6-
            splishsplash-wasm-v1-${{ runner.os }}-emscripten-3.1.6-

      - name: Build and test SPlisHSPlasH browser WASM
        shell: bash
        env:
          SPLISHSPLASH_WASM_WORK_ROOT: ${{ github.workspace }}/.cache/splishsplash-wasm-probe
        run: bash tests/splishsplash-wasm/build.sh

      - name: Build PBD browser WASM
        shell: bash
        env:
          SPLISHSPLASH_WASM_WORK_ROOT: ${{ github.workspace }}/.cache/splishsplash-wasm-probe
        run: bash tests/splishsplash-wasm/build-pbd-probe.sh

      - name: Save SPlisHSPlasH WASM build cache
        if: always() && steps.splish-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/splishsplash-wasm-probe
          key: ${{ steps.splish-cache.outputs.cache-primary-key }}

      - name: Test SPlisHSPlasH page contract
        run: |
          node tests/splishsplash_browser_contract.mjs
          node tests/splishsplash_dambreak_contract.mjs
          node tests/splishsplash_scene_json_contract.mjs
          node tests/splishsplash_generic_scene_contract.mjs
          node tests/splishsplash_generic_dfsph_contract.mjs
          node tests/splishsplash_generic_double_dfsph_contract.mjs
          node tests/splishsplash_scene_browser_contract.mjs
          node tests/splishsplash_pbd_browser_contract.mjs

      - name: Test WASM runtime reset
        run: node tests/wasm_runtime.mjs

      - name: Test generated page contract
        run: node tests/page_contract.mjs

      - name: Validate WebGPU raymarch samples
        shell: bash
        run: |
          set -euxo pipefail
          npm install --no-save --no-package-lock ws

          python3 -m http.server 8000 --directory site >/tmp/sph-http.log 2>&1 &
          HTTP_PID=$!

          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          "$CHROME_BIN" --version

          "$CHROME_BIN" \
            --headless=new \
            --no-sandbox \
            --remote-debugging-address=127.0.0.1 \
            --remote-debugging-port=9222 \
            --enable-unsafe-webgpu \
            --enable-features=Vulkan \
            --use-vulkan=swiftshader \
            --disable-vulkan-fallback-to-gl-for-testing \
            --use-webgpu-adapter=swiftshader \
            --enable-webgpu-developer-features \
            --enable-dawn-features=allow_unsafe_apis \
            --disable-dawn-features=use_dxc \
            --use-gpu-in-tests \
            --enable-unsafe-swiftshader \
            about:blank >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!

          cleanup() {
            kill "$CHROME_PID" "$HTTP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          if ! node tests/splishsplash_scene_browser_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/splishsplash_pbd_browser_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/splishsplash_generic_double_dfsph_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/splishsplash_generic_dfsph_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/splishsplash_generic_scene_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/splishsplash_browser_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/splishsplash_dambreak_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_surface_tension_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_faucet_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_elasticity_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_heightfield_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_basic_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_custom_forces_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          if ! node tests/webgpu_deep_dive_cdp.mjs; then
            cat /tmp/sph-http.log || true
            cat /tmp/chrome.log || true
            exit 1
          fi

          cat /tmp/chrome.log || true

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

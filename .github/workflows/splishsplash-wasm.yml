name: SPlisHSPlasH WASM build probe

on:
  push:
    branches: [main]
    paths:
      - 'tests/splishsplash-wasm/**'
      - '.github/workflows/splishsplash-wasm.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  wasm-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Emscripten build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             emscripten             cmake             ninja-build             libeigen3-dev

      - name: Restore SPlisHSPlasH WASM build cache
        uses: actions/cache@v4
        with:
          path: .cache/splishsplash-wasm-probe
          key: splishsplash-wasm-v1-${{ runner.os }}-emscripten-3.1.6-${{ hashFiles('tests/splishsplash-wasm/prepare_emscripten.py') }}
          restore-keys: |
            splishsplash-wasm-v1-${{ runner.os }}-emscripten-3.1.6-

      - name: Build and execute SPlisHSPlasH WASM smoke probe
        shell: bash
        env:
          SPLISHSPLASH_WASM_WORK_ROOT: ${{ github.workspace }}/.cache/splishsplash-wasm-probe
        run: bash tests/splishsplash-wasm/build.sh

      - name: Upload WASM smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splishsplash-wasm-smoke
          path: tests/splishsplash-wasm/out/
          if-no-files-found: warn

[package]
name = "sph-web-samples"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
nalgebra = "0.35"
salva2d = { version = "0.10.0", features = ["sampling"] }
salva3d = "0.10.0"
rapier2d = "0.35.1"
wasm-bindgen = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salva WASM Canvas — SPH Web Samples</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #dce7f2; }
    main { width: min(94vw, 920px); }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    p { margin: .25rem 0 .8rem; color: #91a4b7; }
    a { color: #9bd4ff; }
    canvas { width: 100%; aspect-ratio: 4 / 3; display: block; background: #05070a; border: 1px solid #26313b; border-radius: 10px; }
    #status { margin-top: .55rem; min-height: 1.2em; font-size: .85rem; color: #9fb5c8; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← SPH Web Samples</a></p>
    <h1>Salva 2D → Rust/WASM → Canvas</h1>
    <p>Minimal SPH sample. Physics runs in Salva; JavaScript only advances the WASM simulation and draws dots.</p>
    <canvas id="view" width="800" height="600" aria-label="SPH particle simulation"></canvas>
    <div id="status">Loading WASM…</div>
  </main>
  <script type="module" src="../../app.js"></script>
</body>
</html>

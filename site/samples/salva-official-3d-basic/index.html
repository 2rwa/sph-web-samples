<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salva examples3d: Basic — SPH Web Samples</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #dce7f2; }
    main { width: min(96vw, 980px); }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    p { margin: .3rem 0 .8rem; color: #91a4b7; }
    a { color: #9bd4ff; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .8rem 0; }
    button { border: 1px solid #3b4b5a; background: #151a20; color: #dce7f2; padding: .5rem .75rem; border-radius: .4rem; cursor: pointer; }
    canvas { width: 100%; aspect-ratio: 4 / 3; display: block; touch-action: none; background: #05070a; border: 1px solid #26313b; border-radius: 10px; }
    #status { margin-top: .55rem; min-height: 1.2em; font-size: .85rem; color: #9fb5c8; font-variant-numeric: tabular-nums; }
    .note { margin-top: 1rem; padding-top: .8rem; border-top: 1px solid #26313b; font-size: .88rem; }
  </style>
</head>
<body>
  <main data-example3d="basic">
    <p><a href="../../">← SPH Web Samples</a></p>
    <h1>Official examples3d web port: Basic</h1>
    <p>A 15×15×15 viscous fluid cube falling into a walled 3D basin.</p>
    <div class="controls">
      <button type="button" id="pause">Pause</button>
      <button type="button" id="reset">Reset</button>
      <a href="https://github.com/dimforge/salva/blob/master/examples3d/basic3.rs">upstream basic3.rs</a>
      <span>Drag to orbit · wheel to zoom</span>
    </div>
    <canvas id="view" width="800" height="600" aria-label="Salva Basic 3D example projected onto Canvas"></canvas>
    <div id="status">Loading WASM…</div>
    <p class="note">Ported with the upstream Rapier fixed ground/walls and Salva StaticSampling boundaries. 3,375 particles.</p>
  </main>
  <script type="module" src="../../official-examples3d.js?v=1.30"></script>
</body>
</html>

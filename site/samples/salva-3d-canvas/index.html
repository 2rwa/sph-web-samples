<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salva 3D Canvas — SPH Web Samples</title>
  <style>
    :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0d10; color: #dce7f2; }
    main { width: min(96vw, 980px); }
    h1 { margin: 0 0 .35rem; font-size: clamp(1.2rem, 3vw, 1.8rem); }
    p { margin: .25rem 0 .8rem; color: #91a4b7; }
    a { color: #9bd4ff; }
    .controls { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; margin: .8rem 0; }
    button { border: 1px solid #3b4b5a; background: #151a20; color: #dce7f2; padding: .5rem .75rem; border-radius: .4rem; cursor: pointer; }
    canvas { width: 100%; aspect-ratio: 4 / 3; display: block; touch-action: none; background: #05070a; border: 1px solid #26313b; border-radius: 10px; }
    #status { margin-top: .55rem; min-height: 1.2em; font-size: .85rem; color: #9fb5c8; font-variant-numeric: tabular-nums; }
    .help { font-size: .88rem; color: #91a4b7; }
  </style>
</head>
<body>
  <main>
    <p><a href="../../">← SPH Web Samples</a></p>
    <h1>Salva 3D → Rust/WASM → Canvas dots</h1>
    <p>Salva computes XYZ particle motion in 3D. JavaScript performs only camera projection and Canvas drawing.</p>
    <div class="controls">
      <button type="button" id="reset">Reset fluid</button>
      <span class="help">Drag the Canvas to orbit the camera. Mouse wheel changes distance.</span>
    </div>
    <canvas id="view" width="800" height="600" aria-label="3D SPH particles projected as Canvas dots"></canvas>
    <div id="status">Loading WASM…</div>
  </main>
  <script type="module" src="../../3d-canvas.js?v=1.03"></script>
</body>
</html>
